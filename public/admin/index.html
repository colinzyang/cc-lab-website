<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CC Lab - Content Management</title>
    <!-- Note: Decap CMS UI styles are bundled inside decap-cms.js; the old
         dist/decap-cms.css CDN link was removed (it has been a 404 in all 3.x releases). -->
    <meta name="robots" content="noindex" />
    <script src="/admin/vendor/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS, self-hosted (vendored) — pinned to the exact version the
         floating ^3.0.0 CDN reference was serving at the time of vendoring,
         so this change is byte-identical and imperceptible. See vendor/README.md
         for provenance and upgrade instructions. -->
    <script src="/admin/vendor/decap-cms@3.16.0.js"></script>
    <!-- BibTeX parsing library for the import widget (vendored) -->
    <script src="/admin/vendor/bibtex-parse@0.0.24.js"></script>
    <!-- Custom BibTeX import widget - loaded after CMS is ready -->
    <script>
      // Wait for CMS to be fully initialized before loading custom widget
      if (window.CMS) {
        var script = document.createElement('script');
        script.src = '/admin/bibtex-widget.js';
        document.body.appendChild(script);
      } else {
        window.addEventListener('DOMContentLoaded', function() {
          var checkCMS = setInterval(function() {
            if (window.CMS) {
              clearInterval(checkCMS);
              var script = document.createElement('script');
              script.src = '/admin/bibtex-widget.js';
              document.body.appendChild(script);
            }
          }, 50);
        });
      }
    </script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.open();
          }
        });
      }
    </script>
  </body>
</html>
